repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        url 'https://api.modrinth.maven.com'
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven { // Registrate
        url 'https://mvn.devos.one/snapshots/'
        content {
            includeGroup('com.tterrag.registrate')
        }
    }
    maven { // Configuration
        url 'https://repo.repsy.io/mvn/toma/public'
        content {
            includeGroup('dev.toma.configuration')
        }
    }
    maven { // GTCEu
        name 'GTCEu Maven'
        url 'https://maven.gtceu.com'
        content {
            includeGroup('com.gregtechceu.gtceu')
            includeGroup('brachy.modularui')
        }
    }
    maven { // AE2, GuideMe
        name 'ModMaven'
        url 'https://modmaven.dev'
        content {
            includeGroup("org.appliedenergistics")
        }
    }
    maven { // Create, Ponder, Flywheel
        url 'https://maven.createmod.net'
    }
    maven { // JEI, Malum, Lodestone
        url 'https://maven.blamejared.com'
        content {
            includeGroup("mezz.jei")
            includeGroup("com.sammy.malum")
            includeGroup("team.lodestar.lodestone")
        }
    }
    maven { // KubeJS, Rhino
        name 'Latvian Maven'
        url 'https://maven.latvian.dev/releases'
        content {
            includeGroup("dev.latvian.mods")
            includeGroup("dev.latvian.apps")
        }
    }
    maven { // KubeJS Transitive (animated-gif-lib)
        url 'https://jitpack.io/'
        content {
            includeGroup("com.github.rtyley")
        }
    }
    maven { // Curios
        name 'Curios Maven'
        url 'https://maven.theillusivec4.top/'
    }
    maven { // Patchouli
        url 'https://maven.blamejared.com'
        content {
            includeGroup("vazkii.patchouli")
        }
    }
    maven { // EMI
        name 'Sleeping Town'
        url 'https://repo.sleeping.town/'
    }
}